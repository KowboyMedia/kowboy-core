# DigitalOcean App Platform app spec: the infrastructure as code strategy §2 asks for.
#
#   create   doctl apps create --spec <local copy with the secrets filled in>
#   read     doctl apps spec get <app-id> > .do/app.yaml      (secrets come back encrypted, safe to commit)
#   update   doctl apps update <app-id> --spec .do/app.yaml
#
# The managed Postgres cluster is the one Kowboy created (Frankfurt, 2026-09-17), so the app runs
# in fra too and binds the cluster's own database and user. The platform hands the cluster's CA
# over as DATABASE_CA_CERT and scripts/start.sh gives it to Node. Production deploys `main` on
# every merge, and nothing reaches `main` except a pull request with green checks (strategy §4).
# Staging is app.staging.yaml: the same cluster with its own database, deploying the `staging`
# branch on every push.
# App id c322d2df-5ba1-4cdd-82b5-407dbe429310, created 2026-09-17 through the API; secrets are encrypted by DigitalOcean.
name: kowboy-core
services:
  - name: web
    github:
      repo: KowboyMedia/kowboy-core
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: sh scripts/start.sh web
    source_dir: /
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: ADMIN_SECRET
        value: EV[1:XHT5pk361HHDg2Nn0Dw5xBKWW2iCV652:VKxYO123nW6fUA7bkwADI5NtQT6vY1T36BHs0IVQUe/7uSBuTNnOBkswVJrHGaP2dhYZug0Ryi9FjII=]
        scope: RUN_TIME
        type: SECRET
      - key: CREDENTIALS_KEY
        value: EV[1:N71KfGweIKlzf42ES3sufrtrqQJ013Mh:I0ZD7+OARrP/BbYy68T9PHSqYa4n1BluG/nbSgXQdNQNG7W0/lWyQfH4WVTve0F4Fh1EBKRdvGN92ytY]
        scope: RUN_TIME
        type: SECRET
      - key: VITEC_WEBHOOK_TOKEN
        value: EV[1:OxipdqTDafYFVf8FXX6NLaV/2tYmkqJk:ZOz9q8aPrzrNiV526Q/l3Nhl9bg4JKi4LmOkmi6BoN1yKVxnDZaApOGJHAMdZf46]
        scope: RUN_TIME
        type: SECRET
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
      http_path: /v1/ready
workers:
  - name: worker
    github:
      repo: KowboyMedia/kowboy-core
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: sh scripts/start.sh worker
    source_dir: /
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: ADMIN_SECRET
        value: EV[1:2qxa1s46zTh9VTuAO3kVmkd/zwIwM2Ep:e73kiq7+ipkjW6J+qGGxsLvAUGeMFR0fYs3v5DSTTTYK7wUjha4BnNjrwylGxAbw6EHAv2FIo7vB37o=]
        scope: RUN_TIME
        type: SECRET
      - key: CREDENTIALS_KEY
        value: EV[1:Fs09bNlwO8Kshl+BvprjOX4Hkyvvn6Jg:kGwyaD5tsXpsADO0jWaTrLIINdPTMpjXQn6Y/hcqe0UDT6NdTsmV0CoQDM5RPi9wGJP2DrrHTmHuL1+r]
        scope: RUN_TIME
        type: SECRET
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
databases:
  - name: db
    engine: PG
    production: true
    cluster_name: kowboy-core-production
    db_name: defaultdb
    db_user: doadmin
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web
features:
  - buildpack-stack=ubuntu-22
