# DigitalOcean App Platform app spec: the infrastructure as code strategy §2 asks for.
#
#   create   doctl apps create --spec <local copy with the secrets filled in>
#   read     doctl apps spec get <app-id> > .do/app.yaml      (secrets come back encrypted, safe to commit)
#   update   doctl apps update <app-id> --spec .do/app.yaml
#
# The managed Postgres cluster is the one Kowboy created (kowboy-core-production, Frankfurt,
# 2026-09-17), so the app runs in fra too and binds the cluster's own database and user. The
# platform hands the cluster's CA over as DATABASE_CA_CERT and scripts/start.sh gives it to Node.
# Production never deploys on push (strategy §4: a human approves, .github/workflows/deploy.yml);
# a staging app is this spec with another name, deploy_on_push true and its own cluster (open
# question 25).
name: kowboy-core
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: kowboy-core-production
    db_name: defaultdb
    db_user: doadmin

services:
  - name: web
    github:
      repo: KowboyMedia/kowboy-core
      branch: main
      deploy_on_push: false
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: sh scripts/start.sh web
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /v1/ready
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: ADMIN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: CREDENTIALS_KEY # 32 random bytes, base64
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: VITEC_WEBHOOK_TOKEN # the secret in the webhook URL Vitec is given
        scope: RUN_TIME
        type: SECRET
        value: ''

workers:
  - name: worker
    github:
      repo: KowboyMedia/kowboy-core
      branch: main
      deploy_on_push: false
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: sh scripts/start.sh worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: ADMIN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: CREDENTIALS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ''
