# The staging app (Patric, 2026-09-17): app.yaml with another name, the `staging` branch deploying
# on push, and its own database `core_staging` on the same cluster. Created, read back and updated
# the same way as app.yaml, with secrets of its own.
# App id 57498bcc-59a5-4812-aa1f-ed65c83a5b2f, created 2026-09-17 through the API; secrets are encrypted by DigitalOcean.
name: kowboy-core-staging
services:
  - name: web
    github:
      repo: KowboyMedia/kowboy-core
      branch: staging
      deploy_on_push: true
    build_command: npm run build
    run_command: sh scripts/start.sh web
    source_dir: /
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: MAIL_FROM
        value: patric@kowboy.se
        scope: RUN_TIME
      - key: POSTMARK_SERVER_TOKEN
        value: EV[1:HDWQpFCri0z9Z/jh4WauuteSPvDZ45Li:v0tHUwi3muaRBba4D3QCv3uSYKie1NiAoac39ySuKnv46m9+7su8NfF8apgULpn/6qxCAw==]
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        value: EV[1:TC95QipSafbeZ7bRSp0ego7jH3veGtTo:ZDpqKlVH+M7+HlgX3et+HuV67WZ28xaaD/m+rUloNZOD7QpU0XpNZ5M8I5Pp6B5CWwqggvSjOaL0pq1Zto4FGviKcDNT6XlSriMYi1PC5f+ZwHUSgPv5M8XayIzyTH0MWAKWvuSnmL+GDaRpZeqB]
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        value: staging
        scope: RUN_TIME
      - key: CREDENTIALS_KEY
        value: EV[1:bgk8XOdGy1VfzAIfz1stxfXc3RiUEyAh:E4vFHMxNaQPOrWRs3ojYRW4SlmsBY8WYGMIsgZ/Il3XJHHsgNUa//7P0DJmN9QvLmOA80tkc/oC/lqqi]
        scope: RUN_TIME
        type: SECRET
      # The admin area (docs/admin-panel.md). On the app since 2026-09-21, on Patric's "allow".
      - key: ADMIN_EMAILS
        value: patric@kowboy.se
        scope: RUN_TIME
      # Everyone at Kowboy may open the area without a list to keep (Patric, 2026-09-21);
      # the sign-in page never gives this away.
      - key: ADMIN_EMAIL_DOMAINS
        value: kowboy.se
        scope: RUN_TIME
      - key: PUBLIC_URL
        value: https://kowboy-core-staging-t7ig3.ondigitalocean.app
        scope: RUN_TIME
      - key: VITEC_WEBHOOK_TOKEN
        value: EV[1:hOO3+g5WuYm4pzme/z4V0vtqUvjPIh84:LcAwrVM/08EW3EQs1S0aFGc3fSdEhFTTUyIjzH7IIZsh+W33a8vTIUcYcWOg+Apu]
        scope: RUN_TIME
        type: SECRET
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
      http_path: /v1/ready
workers:
  - name: worker
    github:
      repo: KowboyMedia/kowboy-core
      branch: staging
      deploy_on_push: true
    build_command: npm run build
    run_command: sh scripts/start.sh worker
    source_dir: /
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: SENTRY_DSN
        value: EV[1:nks+6vHH7J3hHQ3b3nQGRP2K8pTqKXFw:QOyJsScJaFg2f/dGmf1WWbrZQIoPxF+IDg3SupLMBIwyoLVao5M4xK9Y8LwW8X0VOJwnkofaiuC8HsXgNVYu6N/dDV9SxVwQNnF4PD1MPpXuQRkPg7DzsZaAuqW6vWilJCYuvBmf3sAi+8NQsK2Y]
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        value: staging
        scope: RUN_TIME
      # Where Core is reached, for the links in the alerts this worker sends.
      - key: PUBLIC_URL
        value: https://kowboy-core-staging-t7ig3.ondigitalocean.app
        scope: RUN_TIME
      - key: CREDENTIALS_KEY
        value: EV[1:bXCPiQ3i5oZD5/Fpa0u5wNdS+/myat0p:QkNWjoD35n9Rr27BQMbnrndq/yyVbSTvhgkvhS3MCgl5XY2Vz+DCiYoz1VHoRXKDra/3pGqjxmmDQXTA]
        scope: RUN_TIME
        type: SECRET
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
databases:
  - name: db
    engine: PG
    production: true
    cluster_name: kowboy-core-production
    db_name: core_staging
    db_user: doadmin
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web
features:
  - buildpack-stack=ubuntu-22
