# The staging app (Patric, 2026-09-17): app.yaml with another name, the `staging` branch deploying
# on push, and its own database `core_staging` on the same cluster. Created, read back and updated
# the same way as app.yaml, with secrets of its own.
name: kowboy-core-staging
region: fra

alerts:
  - rule: DEPLOYMENT_FAILED

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: kowboy-core-production
    db_name: core_staging
    db_user: doadmin

services:
  - name: web
    github:
      repo: KowboyMedia/kowboy-core
      branch: staging
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: sh scripts/start.sh web
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /v1/ready
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: ADMIN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: CREDENTIALS_KEY # 32 random bytes, base64
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: VITEC_WEBHOOK_TOKEN # the secret in the webhook URL Vitec is given
        scope: RUN_TIME
        type: SECRET
        value: ''

workers:
  - name: worker
    github:
      repo: KowboyMedia/kowboy-core
      branch: staging
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: sh scripts/start.sh worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: ADMIN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ''
      - key: CREDENTIALS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ''
