name: Release

# A tag v* is a release (strategy §4). The WordPress packages, the client plugin and every template
# set, are published to the update channel on the DigitalOcean Space sites read from
# (clients/wordpress/README.md), with the index of sets, and attached to the GitHub Release as the
# record.
#
# Repository variables: DO_SPACES_BUCKET, DO_SPACES_REGION (for example fra1).
# Repository secrets:   DO_SPACES_KEY, DO_SPACES_SECRET (a Spaces access key pair).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  wordpress-client:
    name: WordPress client release
    runs-on: ubuntu-latest
    env:
      CHANNEL: https://${{ vars.DO_SPACES_BUCKET }}.${{ vars.DO_SPACES_REGION }}.digitaloceanspaces.com/
    steps:
      - uses: actions/checkout@v4
      - name: Package the plugin and every template set
        run: |
          php clients/wordpress/release.php package clients/wordpress/core-client core-client dist "$CHANNEL"
          sets=()
          for dir in clients/wordpress/templates/*/; do
            slug=$(basename "$dir")
            php clients/wordpress/release.php package "$dir" "core-client-templates-$slug" dist "$CHANNEL"
            sets+=("$slug=$dir")
          done
          php clients/wordpress/release.php index dist "$CHANNEL" "${sets[@]}"
      - name: Publish to the update channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
          ENDPOINT: https://${{ vars.DO_SPACES_REGION }}.digitaloceanspaces.com
          BUCKET: ${{ vars.DO_SPACES_BUCKET }}
        run: |
          for json in dist/*.json; do
            package=$(basename "$json" .json)
            if [ "$package" = "sets" ]; then continue; fi
            zip=$(php -r 'echo basename(json_decode(file_get_contents($argv[1]), true)["package"]);' "$json")
            aws s3 cp "dist/$package.zip" "s3://$BUCKET/$package/$zip" \
              --endpoint-url "$ENDPOINT" --acl public-read --content-type application/zip
            aws s3 cp "$json" "s3://$BUCKET/$package/$package.json" \
              --endpoint-url "$ENDPOINT" --acl public-read --content-type application/json \
              --cache-control max-age=300
          done
          aws s3 cp dist/sets.json "s3://$BUCKET/sets.json" \
            --endpoint-url "$ENDPOINT" --acl public-read --content-type application/json \
            --cache-control max-age=300
          echo "published to $CHANNEL"
      - name: Attach it to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" --clobber dist/*.zip dist/*.json
