name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  enforced:
    name: Enforced checks (block merge)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://core:core@127.0.0.1:5432/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: The seam
        run: npm run check:seam
      - name: No skipped tests
        run: npm run check:tests
      - name: No committed secrets
        run: npm run check:secrets
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  warnings:
    name: Warnings (never block)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Formatting
        run: npm run format:check
        continue-on-error: true
