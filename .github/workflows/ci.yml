name: CI

# Once per change: on the pull request, and again on what lands on staging and main.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  enforced:
    name: Enforced checks (block merge)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://core:core@127.0.0.1:5432/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: The seam
        run: npm run check:seam
      - name: No skipped tests
        run: npm run check:tests
      - name: No committed secrets
        run: npm run check:secrets
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: A browser for the admin area's journeys
        run: npx playwright install --with-deps chromium
      - name: The admin area's user journeys
        run: npm run test:journeys

  wordpress:
    name: WordPress client tests (block merge)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: core_client_test
          MARIADB_USER: core
          MARIADB_PASSWORD: core
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://core:core@127.0.0.1:5432/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: php --version
      - name: The WordPress checkout and WP-CLI from the last run
        uses: actions/cache@v4
        with:
          path: ~/.cache/kowboy-core
          key: wordpress-7.1
      - name: A WordPress install with the plugin active
        run: bash clients/wordpress/test/setup.sh
      - name: WordPress client tests
        run: npm run test:wordpress
      - name: Build (the journeys' site runs from dist)
        run: npm run build
      - name: A browser for the client's journeys
        run: npx playwright install --with-deps chromium
      - name: The WordPress client's user journeys
        run: npm run test:journeys:wordpress

  warnings:
    name: Warnings (never block)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Formatting
        run: npm run format:check
        continue-on-error: true
      - name: Registers consistent
        run: npm run check:register
        continue-on-error: true
      - name: PHPStan (WordPress client)
        run: |
          composer install --no-interaction --no-progress --working-dir=clients/wordpress
          clients/wordpress/vendor/bin/phpstan analyse --configuration=clients/wordpress/phpstan.neon --no-progress
        continue-on-error: true
